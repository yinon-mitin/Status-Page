name: Bug report
description: Report a reproducible problem in this repository's Docker, Terraform, automation, or documentation
title: "[Bug]: "
labels: ["bug", "unverified"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private Terraform values, state files, plan files, or unredacted logs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Local Docker environment
        - AWS and Terraform
        - GitHub Actions and release automation
        - Backup and restore
        - Documentation
        - Status-Page application
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Repository revision
      description: Commit SHA or release tag used for the test.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Docker/Terraform version, and AWS Region when relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Include only the relevant output after removing secrets, account identifiers, hostnames, and private values.
      render: shell

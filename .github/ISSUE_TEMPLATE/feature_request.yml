name: Feature request
description: Propose a focused improvement to the project
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Local Docker environment
        - AWS and Terraform
        - GitHub Actions and release automation
        - Backup and restore
        - Monitoring and integrations
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the operational problem this change would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change and how it could be verified.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs
      description: Note expected cost, security, compatibility, or maintenance effects.
    validations:
      required: false

name: Publish images to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'il-central-1' }}
  ECR_APP_REPOSITORY: ${{ vars.ECR_APP_REPOSITORY || 'statuspage-dev-app' }}
  ECR_NGINX_REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY || 'statuspage-dev-nginx' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'yinon-status-page-prod' }}
  ECS_WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE || 'web' }}
  ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE || 'worker' }}
  ECS_SCHEDULER_SERVICE: ${{ vars.ECS_SCHEDULER_SERVICE || 'scheduler' }}

jobs:
  publish:
    name: Build and publish immutable images
    if: vars.AWS_ROLE_TO_ASSUME != ''
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_APP_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push NGINX image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          platforms: linux/amd64
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_NGINX_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy immutable images to production
    needs: publish
    if: needs.publish.result == 'success' && vars.AWS_DEPLOY_ROLE_TO_ASSUME != ''
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Configure deployment credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - id: registry
        name: Resolve ECR registry
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "value=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Register task definitions with this immutable image version
        env:
          APP_IMAGE: ${{ steps.registry.outputs.value }}/${{ env.ECR_APP_REPOSITORY }}:sha-${{ github.sha }}
          NGINX_IMAGE: ${{ steps.registry.outputs.value }}/${{ env.ECR_NGINX_REPOSITORY }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          deploy_service() {
            local service="$1"
            local update_nginx="$2"
            local task_definition updated_definition task_arn

            task_definition="$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$service" \
              --query 'services[0].taskDefinition' \
              --output text)"

            updated_definition="$(aws ecs describe-task-definition \
              --task-definition "$task_definition" \
              --query taskDefinition \
              --output json | jq \
                --arg app_image "$APP_IMAGE" \
                --arg nginx_image "$NGINX_IMAGE" \
                --argjson update_nginx "$update_nginx" '
                  del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy,
                      .deregisteredAt) |
                  .containerDefinitions |= map(
                    if .name == "app" then .image = $app_image
                    elif .name == "nginx" and $update_nginx then .image = $nginx_image
                    else . end
                  )'))"

            task_arn="$(aws ecs register-task-definition \
              --cli-input-json "$updated_definition" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)"
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$service" \
              --task-definition "$task_arn" \
              --force-new-deployment >/dev/null
          }

          deploy_service "$ECS_WEB_SERVICE" true
          deploy_service "$ECS_WORKER_SERVICE" false
          deploy_service "$ECS_SCHEDULER_SERVICE" false

      - name: Wait for stable ECS services
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WEB_SERVICE" "$ECS_WORKER_SERVICE" "$ECS_SCHEDULER_SERVICE"

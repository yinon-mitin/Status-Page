name: Publish images to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Build and publish immutable images
        required: true
        type: boolean
        default: true
      deploy:
        description: Publish images and run the approved ECS deployment
        required: true
        type: boolean
        default: true

run-name: Production release ${{ github.sha }}

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_APP_REPOSITORY: ${{ vars.ECR_APP_REPOSITORY }}
  ECR_NGINX_REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE }}
  ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
  ECS_SCHEDULER_SERVICE: ${{ vars.ECS_SCHEDULER_SERVICE }}
  PUBLIC_HEALTHCHECK_URL: ${{ vars.PUBLIC_HEALTHCHECK_URL }}

jobs:
  release-gate:
    name: Validate production release configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        name: Fail closed when production is paused or misconfigured
        env:
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_ENABLED }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          AWS_DEPLOY_ROLE_TO_ASSUME: ${{ vars.AWS_DEPLOY_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          if [[ "$PRODUCTION_ENABLED" != "true" ]]; then
            echo "Production release is intentionally paused."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Production releases are restricted to main." >&2
            exit 1
          }
          [[ "$GITHUB_REPOSITORY" == "yinon-mitin/Status-Page" ]] || {
            echo "Production releases are restricted to yinon-mitin/Status-Page." >&2
            exit 1
          }
          for name in AWS_ACCOUNT_ID AWS_REGION ECR_APP_REPOSITORY ECR_NGINX_REPOSITORY ECS_CLUSTER \
            ECS_WEB_SERVICE ECS_WORKER_SERVICE ECS_SCHEDULER_SERVICE PUBLIC_HEALTHCHECK_URL \
            AWS_ROLE_TO_ASSUME AWS_DEPLOY_ROLE_TO_ASSUME; do
            [[ -n "${!name:-}" ]] || { echo "Repository Variable $name is required." >&2; exit 1; }
          done
          [[ "$ECR_APP_REPOSITORY" == "yinon-status-page-prod-app" ]]
          [[ "$ECR_NGINX_REPOSITORY" == "yinon-status-page-prod-nginx" ]]
          [[ "$ECS_CLUSTER" == "yinon-status-page-prod" ]]
          [[ "$AWS_ACCOUNT_ID" == "992382545251" ]]
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish immutable images
    needs: release-gate
    if: needs.release-gate.outputs.enabled == 'true' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_TO_ASSUME" || {
            echo "Repository Variable AWS_ROLE_TO_ASSUME is required." >&2
            exit 1
          }

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push application image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_APP_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push NGINX image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          platforms: linux/amd64
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_NGINX_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  production-approval:
    name: Approve production deployment
    needs: [release-gate, publish]
    if: always() && needs.release-gate.outputs.enabled == 'true' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Record approval boundary
        run: echo "Production deployment approved for $GITHUB_SHA"

  deploy-production:
    name: Deploy immutable images to production
    needs: [release-gate, publish, production-approval]
    if: always() && needs.release-gate.outputs.enabled == 'true' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && needs.production-approval.result == 'success' && (github.event_name == 'push' || inputs.deploy) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out deployment automation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate deployment configuration
        env:
          AWS_DEPLOY_ROLE_TO_ASSUME: ${{ vars.AWS_DEPLOY_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          test -n "$AWS_DEPLOY_ROLE_TO_ASSUME" || {
            echo "Repository Variable AWS_DEPLOY_ROLE_TO_ASSUME is required." >&2
            exit 1
          }

      - name: Configure deployment credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy immutable task definitions and verify health
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          APP_IMAGE: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_APP_REPOSITORY }}:sha-${{ github.sha }}
          NGINX_IMAGE: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_NGINX_REPOSITORY }}:sha-${{ github.sha }}
        run: scripts/deploy_ecs_release.sh

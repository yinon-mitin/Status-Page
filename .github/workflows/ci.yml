name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Docker and Terraform validation
    runs-on: ubuntu-latest
    env:
      STATUSPAGE_HTTP_PORT: 18081
      STATUS_PAGE_SITE_URL: http://localhost:18081

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Docker Compose configuration
        run: docker compose config --quiet

      - name: Build local runtime images
        run: docker compose build

      - name: Start the complete Compose stack
        run: docker compose -p statuspage-ci up -d --wait --wait-timeout 120

      - name: Smoke test reverse proxy and Django
        run: |
          curl --fail --silent --show-error http://localhost:18081/healthz
          curl --fail --silent --show-error -o /dev/null http://localhost:18081/
          docker compose -p statuspage-ci exec -T web python manage.py check
          docker compose -p statuspage-ci exec -T web python /opt/status-page/scripts/verify_runtime.py

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without remote state
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run Terraform static quality checks
        run: |
          tflint --init --config=terraform/.tflint.hcl
          tflint --recursive --config=terraform/.tflint.hcl

      - name: Clean up Compose resources
        if: always()
        run: docker compose -p statuspage-ci down -v --remove-orphans
